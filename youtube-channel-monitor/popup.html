<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>YT Channel Monitor</title></head><body><header class="h"><button class="h-ref" id="h-ref" title="Refresh status">🔄</button><h1>📺 YouTube Channel Monitor</h1><div class="stat" id="stat"><span class="ind" id="ind"></span> <span id="st-text">Loading...</span></div></header><div class="ctrl" role="toolbar"><div class="tabs" role="tablist"><button id="tab-ch" class="tab active" role="tab" aria-selected="true" aria-controls="res">📺 Channels</button><button id="tab-wl" class="tab" role="tab" aria-selected="false" aria-controls="res">🕐 Watch Later</button></div><button id="btn-check" class="btn primary" title="Check channels now (Ctrl+Shift+Y)"><span id="checkNowIcon">🔍</span> Check Now</button><select id="f-time" title="Filter videos by time"><option value="1hour">Last 1 hour</option><option value="1day">Last 24 hours</option><option value="1week">Last week</option><option value="1month">Last month</option><option value="sincelastvisit">Since last visit</option></select><select id="f-sort" title="Sort channels by"><option value="name">🔤 Name</option><option value="new">✨ New Videos</option><option value="activity">⚡ Activity</option></select><select id="f-show" title="Filter channel visibility"><option value="all">👁️ All Channels</option><option value="newonly">🆕 New Videos Only</option></select><input type="search" id="f-search" placeholder="🔍 Search channels..." title="Search channels by name"><label id="f-hw" title="Hide videos marked as watched"><input type="checkbox" id="f-hw-cb"> 👁️‍🗨️ Hide Watched</label><button id="btn-cw" class="btn warning" title="Clear all watched video flags">🔄 Clear Watched</button></div><div class="s-bar" id="s-bar" aria-live="polite"><div class="s-item"><span class="s-icon">📺</span> <span>Channels: <strong id="s-ch">0</strong></span></div><div class="s-item"><span class="s-icon">✨</span> <span>New: <strong id="s-new">0</strong></span></div><div class="s-item"><span class="s-icon">🎥</span> <span>Total: <strong id="s-total">0</strong></span></div><div class="s-item"><span class="s-icon">🕐</span> <span>Watch Later: <strong id="s-wl">0</strong></span></div><div class="s-item"><span class="s-icon">👁️</span> <span>Watched: <strong id="s-watched">0</strong></span></div></div><main id="res" class="res" tabindex="0" aria-live="polite"><div class="loading"><div>Loading...</div></div></main><details class="set" id="set"><summary>Settings & Options</summary><div class="set-c"><div class="set-i"><label for="set-int">⏰ Check Interval:</label><select id="set-int" title="How often to check for new videos"><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option><option value="120">2 hours</option><option value="360">6 hours</option></select></div><div class="set-i"><label for="set-notif"><input type="checkbox" id="set-notif"> 🔔 Desktop Notifications</label></div><div class="set-i"><label for="set-open">🎯 Open Videos In:</label><select id="set-open" title="How to open video links"><option value="current">Current Tab</option><option value="new">New Tab</option><option value="background">Background Tab</option></select></div><div class="set-i"><label>👁️ Watched Video Tracking</label><button id="set-rw" class="btn secondary" title="Reset all watched video flags">🔄 Reset All</button></div><div class="set-i"><button id="set-cd" class="btn secondary" title="Clear all cached video data">🗑️ Clear Cache</button><button id="set-ex" class="btn secondary" title="Export watch later list">📤 Export Data</button></div></div></details><script src="popup.js"></script></body></html>
