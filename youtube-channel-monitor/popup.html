<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
    <title>YT Channel Monitor</title>
</head>
<body>
    <header class="header">
        <div class="header-title">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21.582 6.186a2.533 2.533 0 0 0-1.76-1.784C18.25 4 12 4 12 4s-6.25 0-7.822.402a2.533 2.533 0 0 0-1.76 1.784C2 7.778 2 12 2 12s0 4.222.418 5.814a2.533 2.533 0 0 0 1.76 1.784C5.75 20 12 20 12 20s6.25 0 7.822-.402a2.533 2.533 0 0 0 1.76-1.784C22 16.222 22 12 22 12s0-4.222-.418-5.814zM10 15.464V8.536L16 12l-6 3.464z"></path></svg>
            <span>Channel Monitor</span>
        </div>
        <div class="status" id="stat">
            <span class="indicator" id="ind"></span>
            <span id="st-text">Loading...</span>
        </div>
    </header>

    <div class="controls-wrapper">
        <div class="main-controls">
            <div class="tab-bar" role="tablist">
                <button id="tab-ch" class="tab active" role="tab">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M3 4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H3zm2 2a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6zm4 0a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V6zm4 0a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V6z"></path></svg>
                    Channels
                </button>
                <button id="tab-wl" class="tab" role="tab">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm.75-13a.75.75 0 0 0-1.5 0v5c0 .414.336.75.75.75h4a.75.75 0 0 0 0-1.5h-3.25V5z" clip-rule="evenodd"></path></svg>
                    Watch Later
                </button>
            </div>
            <button id="btn-check" class="btn primary">
                 <svg class="icon-check" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M15.312 11.312a.75.75 0 0 1 0-1.062l1.98-1.98a.75.75 0 0 1 1.06 0V3.75a.75.75 0 0 1-1.5 0v-.379l-1.98 1.98a.75.75 0 0 1-1.06 0ZM4.688 8.688a.75.75 0 0 1 0 1.062l-1.98 1.98a.75.75 0 0 1-1.06 0V16.25a.75.75 0 0 1 1.5 0v.379l1.98-1.98a.75.75 0 0 1 1.06 0ZM11.312 4.688a.75.75 0 0 1 1.062 0l1.98 1.98a.75.75 0 0 1 0 1.06V11.25a.75.75 0 0 1-1.5 0v.379l-1.98-1.98a.75.75 0 0 1 0-1.062ZM8.688 15.312a.75.75 0 0 1-1.062 0l-1.98-1.98a.75.75 0 0 1 0-1.06V8.75a.75.75 0 0 1 1.5 0v-.379l1.98 1.98a.75.75 0 0 1 0 1.062Z" clip-rule="evenodd"></path></svg>
                 <svg class="icon-loader" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M8.515 2.222a.75.75 0 0 1 1.06 0 8.485 8.485 0 0 1 4.774 8.84-8.485 8.485 0 0 1-8.84 4.774.75.75 0 0 1-.392-1.42A6.986 6.986 0 0 0 15.02 10a6.986 6.986 0 0 0-11.41-5.122.75.75 0 0 1-1.03-1.09A8.485 8.485 0 0 1 8.515 2.222Z"></path></svg>
                Check Now
            </button>
        </div>
        <div class="filter-controls" id="filter-controls">
            <select id="f-time"><option value="1day">Last 24 hours</option><option value="1week">Last week</option><option value="1month">Last month</option><option value="sincelastvisit">Since last visit</option></select>
            <select id="f-sort"><option value="activity">⚡ Activity</option><option value="new">✨ New Videos</option><option value="name">🔤 Name</option></select>
            <input type="search" id="f-search" placeholder="Search channels...">
            <label id="f-hw" class="btn"><input type="checkbox" id="f-hw-cb"> Hide Watched</label>
            <button id="btn-cw" class="btn warning">Clear Watched</button>
        </div>
    </div>

    <div class="s-bar" id="s-bar" aria-live="polite">
        <div class="s-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M3 4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H3zm2 2a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6z"></path></svg> Channels: <strong id="s-ch">0</strong></div>
        <div class="s-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M10.75 2.75a.75.75 0 0 0-1.5 0V6h-3.25a.75.75 0 0 0 0 1.5h3.25v3.25a.75.75 0 0 0 1.5 0V7.5h3.25a.75.75 0 0 0 0-1.5H10.75V2.75z"></path><path fill-rule="evenodd" d="M9.755 11.583a.75.75 0 0 0-1.06 1.06l1.732 1.732a2.25 2.25 0 1 0 3.182-3.182l-1.732-1.732a.75.75 0 0 0-1.06 1.06l1.732 1.732a.75.75 0 1 1-1.06 1.06l-1.732-1.732z" clip-rule="evenodd"></path></svg> New: <strong id="s-new">0</strong></div>
        <div class="s-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M3.5 2A1.5 1.5 0 0 0 2 3.5v13A1.5 1.5 0 0 0 3.5 18h13a1.5 1.5 0 0 0 1.5-1.5v-13A1.5 1.5 0 0 0 16.5 2h-13zM8 6a.75.75 0 0 1 .75.75v1.5h1.5a.75.75 0 0 1 0 1.5h-1.5v1.5a.75.75 0 0 1-1.5 0v-1.5h-1.5a.75.75 0 0 1 0-1.5h1.5v-1.5A.75.75 0 0 1 8 6z"></path></svg> Total: <strong id="s-total">0</strong></div>
        <div class="s-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm.75-13a.75.75 0 0 0-1.5 0v5c0 .414.336.75.75.75h4a.75.75 0 0 0 0-1.5h-3.25V5z" clip-rule="evenodd"></path></svg> Watch Later: <strong id="s-wl">0</strong></div>
        <div class="s-item"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path><path fill-rule="evenodd" d="M.664 10.59a1.651 1.651 0 0 1 0-1.18l.88-1.473a1.65 1.65 0 0 1 1.52-.906l1.67.001c.497 0 .962.214 1.285.572l.786.812a1.65 1.65 0 0 1 0 2.316l-.786.812a1.65 1.65 0 0 1-1.285.572l-1.67-.001a1.65 1.65 0 0 1-1.52-.906l-.88-1.473zM17.456 10.59a1.651 1.651 0 0 1 0-1.18l.88-1.473a1.65 1.65 0 0 1 1.52-.906l1.67.001c.497 0 .962.214 1.285.572l.786.812a1.65 1.65 0 0 1 0 2.316l-.786.812a1.65 1.65 0 0 1-1.285.572l-1.67-.001a1.65 1.65 0 0 1-1.52-.906l-.88-1.473z" clip-rule="evenodd"></path></svg> Watched: <strong id="s-watched">0</strong></div>
    </div>

    <main id="res" class="res"></main>

    <details class="set" id="set">
        <summary>Settings</summary>
        <div class="set-c">
            <div class="set-i"><label for="set-int">Check Interval:</label><select id="set-int"><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 hour</option></select></div>
            <div class="set-i"><label for="set-open">Open Videos In:</label><select id="set-open"><option value="current">Current Tab</option><option value="new">New Tab</option><option value="background">Background Tab</option></select></div>
            <div class="set-i"><label for="set-notif"><input type="checkbox" id="set-notif"> Desktop Notifications</label></div>
            <div class="set-i"><label>Actions</label><div style="display:flex; gap: 8px;"><button id="set-rw" class="btn">Reset Watched</button><button id="set-cd" class="btn">Clear Cache</button><button id="set-ex" class="btn">Export</button></div></div>
        </div>
    </details>

    <script src="popup.js"></script>
</body>
</html>
