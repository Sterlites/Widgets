<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>YouTube Channel Monitor</title>
</head>
<body>
  <header class="header">
    <h1>📺 YouTube Channel Monitor</h1>
    <div class="status" id="status">
      <span class="indicator" id="indicator"></span>
      <span id="statusText">Loading...</span>
    </div>
  </header>

  <div class="controls" role="toolbar" aria-label="Main controls">
    <div class="tab-bar" role="tablist" aria-label="View tabs">
      <button id="tabChannels" class="tab active" role="tab" aria-selected="true" aria-controls="results">Channels</button>
      <button id="tabWatchLater" class="tab" role="tab" aria-selected="false" aria-controls="results">Watch Later</button>
    </div>

    <button id="checkNow" class="btn primary" title="Check channels now">Check Now</button>

    <select id="timeFilter" aria-label="Time filter">
      <option value="1hour">Last 1 hour</option>
      <option value="1day">Last 24 hours</option>
      <option value="1week">Last week</option>
      <option value="1month">Last month</option>
      <option value="sincelastvisit">Since last visit</option>
    </select>

    <select id="sortBy" aria-label="Sort channels">
      <option value="name">Name</option>
      <option value="new">New Videos</option>
      <option value="activity">Activity</option>
    </select>

    <select id="showFilter" aria-label="Show filter">
      <option value="all">All Channels</option>
      <option value="newonly">New Videos Only</option>
    </select>

    <input type="search" id="search" placeholder="Search channels..." aria-label="Search channels">
  </div>

  <div class="stats" id="stats" aria-live="polite">
    <span>Channels: <strong id="channelCount">0</strong></span>
    <span>New: <strong id="newCount">0</strong></span>
    <span>Total: <strong id="totalCount">0</strong></span>
    <span>Watch Later: <strong id="watchLaterCount">0</strong></span>
  </div>

  <main id="results" class="results" tabindex="0" aria-live="polite">
    <div class="loading">Loading...</div>
  </main>

  <details class="settings">
    <summary>Settings</summary>
    <div class="setting">
      <label>Check Interval:
        <select id="checkInterval">
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">1 hour</option>
        </select>
      </label>
    </div>
    <div class="setting">
      <label>
        <input type="checkbox" id="notifications"> Desktop Notifications
      </label>
    </div>
    <button id="clearData" class="btn secondary">Clear Data</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
