<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h2>YouTube Channel Monitor</h2>
    <div class="status" id="status">Checking...</div>
  </div>

  <div class="section">
    <h3>Settings</h3>
    <div class="setting-row">
      <label for="checkInterval">Check Interval (minutes):</label>
      <select id="checkInterval">
        <option value="5">5 minutes</option>
        <option value="15">15 minutes</option>
        <option value="30">30 minutes</option>
        <option value="60">1 hour</option>
        <option value="180">3 hours</option>
      </select>
    </div>
    <button id="checkNow" class="btn-primary">Check Now</button>
    <button id="clearNotifications" class="btn-secondary">Clear Notifications</button>
  </div>

  <div class="section">
    <h3>Monitored Channels</h3>
    <div id="channelsList" class="channels-list">
      Loading...
    </div>
  </div>

  <div class="section">
    <h3>New Videos</h3>
    <div id="notificationsList" class="notifications-list">
      No new videos
    </div>
  </div>

  <div class="section">
    <h3>Instructions</h3>
    <div class="instructions">
      <p>1. Create a bookmarks folder named "Vid"</p>
      <p>2. Add YouTube channel /videos pages to this folder</p>
      <p>3. The extension will automatically monitor for new uploads</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
