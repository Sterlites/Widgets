<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>YouTube Channel Monitor</title>
</head>
<body>
  <header class="header">
    <button class="header-refresh" id="headerRefresh" title="Refresh status">🔄</button>
    <h1>📺 YouTube Channel Monitor</h1>
    <div class="status" id="status">
      <span class="indicator" id="indicator"></span>
      <span id="statusText">Loading...</span>
    </div>
  </header>

  <div class="controls" role="toolbar" aria-label="Main controls">
    <div class="tab-bar" role="tablist" aria-label="View tabs">
      <button id="tabChannels" class="tab active" role="tab" aria-selected="true" aria-controls="results">
        📺 Channels
      </button>
      <button id="tabWatchLater" class="tab" role="tab" aria-selected="false" aria-controls="results">
        🕐 Watch Later
      </button>
    </div>

    <button id="checkNow" class="btn primary" title="Check channels now (Ctrl+Shift+Y)">
      <span id="checkNowIcon">🔍</span> Check Now
    </button>

    <select id="timeFilter" aria-label="Time filter" title="Filter videos by time">
      <option value="1hour">Last 1 hour</option>
      <option value="1day">Last 24 hours</option>
      <option value="1week">Last week</option>
      <option value="1month">Last month</option>
      <option value="sincelastvisit">Since last visit</option>
    </select>

    <select id="sortBy" aria-label="Sort channels" title="Sort channels by">
      <option value="name">🔤 Name</option>
      <option value="new">✨ New Videos</option>
      <option value="activity">⚡ Activity</option>
    </select>

    <select id="showFilter" aria-label="Show filter" title="Filter channel visibility">
      <option value="all">👁️ All Channels</option>
      <option value="newonly">🆕 New Videos Only</option>
    </select>

    <input type="search" id="search" placeholder="🔍 Search channels..." aria-label="Search channels" title="Search channels by name">

    <!-- NEW: Watched video controls -->
    <label id="hideWatched" title="Hide videos marked as watched">
      <input type="checkbox" id="hideWatchedCheckbox"> 👁️‍🗨️ Hide Watched
    </label>

    <button id="clearWatched" class="btn warning" title="Clear all watched video flags">
      🔄 Clear Watched
    </button>
  </div>

  <div class="stats" id="stats" aria-live="polite">
    <div class="stat-item">
      <span class="stat-icon">📺</span>
      <span>Channels: <strong id="channelCount">0</strong></span>
    </div>
    <div class="stat-item">
      <span class="stat-icon">✨</span>
      <span>New: <strong id="newCount">0</strong></span>
    </div>
    <div class="stat-item">
      <span class="stat-icon">🎥</span>
      <span>Total: <strong id="totalCount">0</strong></span>
    </div>
    <div class="stat-item">
      <span class="stat-icon">🕐</span>
      <span>Watch Later: <strong id="watchLaterCount">0</strong></span>
    </div>
    <!-- NEW: Watched videos count -->
    <div class="stat-item">
      <span class="stat-icon">👁️</span>
      <span>Watched: <strong id="watchedCount">0</strong></span>
    </div>
  </div>

  <main id="results" class="results" tabindex="0" aria-live="polite">
    <div class="loading">
      <div>Loading your channels...</div>
    </div>
  </main>

  <details class="settings" id="settings">
    <summary>Settings & Options</summary>
    <div class="settings-content">
      <div class="setting">
        <label for="checkInterval">
          ⏰ Check Interval:
        </label>
        <select id="checkInterval" title="How often to check for new videos">
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">1 hour</option>
          <option value="120">2 hours</option>
          <option value="360">6 hours</option>
        </select>
      </div>
      
      <div class="setting">
        <label for="notifications">
          <input type="checkbox" id="notifications"> 
          🔔 Desktop Notifications
        </label>
      </div>
      
      <div class="setting">
        <label for="autoOpen">
          🎯 Open Videos In:
        </label>
        <select id="autoOpen" title="How to open video links">
          <option value="current">Current Tab</option>
          <option value="new">New Tab</option>
          <option value="background">Background Tab</option>
        </select>
      </div>
      
      <!-- NEW: Watched video settings -->
      <div class="setting">
        <label>
          👁️ Watched Video Tracking
        </label>
        <button id="resetWatched" class="btn secondary" title="Reset all watched video flags">
          🔄 Reset All
        </button>
      </div>
      
      <div class="setting">
        <button id="clearData" class="btn secondary" title="Clear all cached video data">
          🗑️ Clear Cache
        </button>
        <button id="exportData" class="btn secondary" title="Export watch later list">
          📤 Export Data
        </button>
      </div>
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
